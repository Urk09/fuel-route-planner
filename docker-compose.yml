name: fuel-route-planner
services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: fuel_route_planner
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
    
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

volumes:
    pgdata: